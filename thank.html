<main class="container">
    <div class="contact-grid">
        <div class="info-card" id="formContainer">
            <h2>Request a Cargo Shipment Quote</h2>
            <form id="quoteForm" action="https://formsubmit.co/1233a26cfc71ac026ab36a3426f8e462" method="POST" enctype="multipart/form-data">
                
                <!-- Remove _next redirect so FormSubmit accepts AJAX -->
                <input type="hidden" name="_subject" value="New Cargo Quote Request | Airsell Cargo">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="false">

                <!-- Hidden Inputs for Calculated Values -->
                <input type="hidden" id="hiddenCBM" name="Calculated Total Volume (CBM)" value="0.00 CBM">
                <input type="hidden" id="hiddenVolumetric" name="Calculated Volumetric Weight" value="0.00 kg">
                <input type="hidden" id="hiddenChargeable" name="Billed Chargeable Weight" value="0.00 kg">

                <!-- SECTION 1: CONTACT INFORMATION -->
                <h3 class="form-section-title">1. Contact & Company</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName" class="form-label">Full Name *</label>
                        <input type="text" id="fullName" name="Full Name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email" id="email" name="Email Address" required placeholder="john@example.com">
                    </div>
                </div>

                <!-- SECTION 2: DIMENSIONS & WEIGHT -->
                <h3 class="form-section-title">2. Dimensions & Weight</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Dimensions (L x W x H in cm)</label>
                        <div class="dim-inputs">
                            <input type="number" id="length" min="0" placeholder="L" oninput="calculateFreight()">
                            <input type="number" id="width" min="0" placeholder="W" oninput="calculateFreight()">
                            <input type="number" id="height" min="0" placeholder="H" oninput="calculateFreight()">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="actualWeight" class="form-label">Actual Weight (kg) *</label>
                        <input type="number" id="actualWeight" name="Actual Weight (kg)" min="0" required oninput="calculateFreight()">
                    </div>
                </div>

                <!-- SUMMARY BOX -->
                <div class="summary-box" aria-live="polite">
                    <div class="summary-item">
                        <label>Total Volume</label>
                        <span id="resCBM">0.00 CBM</span>
                    </div>
                    <div class="summary-item">
                        <label>Chargeable Weight</label>
                        <span id="resChargeable" style="color: var(--brand-red);">0.00 kg</span>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Request Instant Quote</button>
            </form>
        </div>

        <!-- HIDDEN THANK YOU CARD (Revealed on Submission) -->
        <div class="info-card" id="thankYouCard" style="display: none; text-align: center; padding: 50px 30px;">
            <div style="width: 70px; height: 70px; background: #e6f4e6; color: #008800; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 20px;">
                ✓
            </div>
            <h2 style="color: var(--primary-dark); margin-bottom: 10px;">Quote Request Received!</h2>
            <p style="color: var(--text-gray); max-width: 500px; margin: 0 auto 25px;">
                Thank you, <strong id="userName">Customer</strong>! We have received your freight request. Our team is calculating the exact rates and will send your full quote to <strong id="userEmail">your email</strong> within <strong>24 hours</strong>.
            </p>
            <button onclick="window.location.reload();" class="btn-submit" style="max-width: 220px; margin: 0 auto;">Submit Another Request</button>
        </div>
    </div>
</main>

<script>
    // 1. Freight Calculation Engine
    function calculateFreight() {
        const length = Math.max(0, parseFloat(document.getElementById('length').value) || 0);
        const width = Math.max(0, parseFloat(document.getElementById('width').value) || 0);
        const height = Math.max(0, parseFloat(document.getElementById('height').value) || 0);
        const actualWeight = Math.max(0, parseFloat(document.getElementById('actualWeight').value) || 0);

        const totalCBM = (length * width * height) / 1000000;
        const volumetricWeight = (length * width * height) / 6000;
        const chargeableWeight = Math.max(actualWeight, volumetricWeight);

        document.getElementById('resCBM').innerText = totalCBM.toFixed(2) + ' CBM';
        document.getElementById('resChargeable').innerText = chargeableWeight.toFixed(2) + ' kg';

        document.getElementById('hiddenCBM').value = totalCBM.toFixed(2) + ' CBM';
        document.getElementById('hiddenVolumetric').value = volumetricWeight.toFixed(2) + ' kg';
        document.getElementById('hiddenChargeable').value = chargeableWeight.toFixed(2) + ' kg';
    }

    // 2. Single-Page AJAX Submission Handler
    const form = document.getElementById('quoteForm');
    form.addEventListener('submit', function (e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = 'Sending Request...';
        submitBtn.disabled = true;

        const formData = new FormData(form);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
        .then(response => {
            if (response.ok) {
                // Populate user confirmation text
                document.getElementById('userName').innerText = document.getElementById('fullName').value;
                document.getElementById('userEmail').innerText = document.getElementById('email').value;

                // Seamless Single-Page Toggle
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('thankYouCard').style.display = 'block';
                window.scrollTo({ top: 100, behavior: 'smooth' });
            } else {
                alert('Oops! There was a problem submitting your form. Please try again.');
                submitBtn.innerText = 'Request Instant Quote';
                submitBtn.disabled = false;
            }
        })
        .catch(() => {
            alert('Submission failed. Please check your connection.');
            submitBtn.innerText = 'Request Instant Quote';
            submitBtn.disabled = false;
        });
    });
</script>
