<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Contact Our Logistics Experts | Airsell Cargo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --brand-red: #cc0000;
      --brand-green: #008800;
      --brand-yellow: #ffcc00;
      --primary-dark: #001f3f;
      --text-gray: #64748b;
      --card-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; margin: 0; background: #f1f5f9; color: #1e293b; line-height: 1.6; }
    .container { max-width: 1200px; margin: auto; padding: 0 24px; }
    header { background: white; border-bottom: 4px solid var(--brand-yellow); box-shadow: 0 4px 6px rgba(0,0,0,0.15); }
    .header-flex { display: flex; justify-content: space-between; align-items: center; }
    .nav-links { list-style: none; display: flex; gap: 6px; margin: 0; }
    .nav-links a { text-decoration: none; color: var(--primary-dark); font-weight: 600; text-transform: uppercase; font-size: 0.85rem; transition: 0.3s; }
    .nav-links a.active { color: var(--brand-red); border-bottom: 2px solid var(--brand-red); padding-bottom: 5px; }
    .hero-banner { text-align: center; padding: 80px 0 120px; background: white; border-bottom: 1px solid #e2e8f0; }
    .hero-banner h1 { font-size: 2.8rem; margin: 0 0 15px; font-weight: 800; color: var(--primary-dark); }
    .hero-banner p { font-size: 1.1rem; color: var(--text-gray); max-width: 600px; margin: 0 auto; border-top: 4px solid var(--brand-red); padding-top: 20px; }
    .contact-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; margin-top: -60px; padding-bottom: 80px; }
    .info-card, .advantage-box { background: white; padding: 40px; border-radius: 12px; box-shadow: var(--card-shadow); }
    .info-card { border-top: 6px solid var(--brand-red); }
    .info-card h2 { margin-top: 0; color: var(--primary-dark); }
    .info-card h3 { margin-top: 25px; color: var(--brand-red); font-size: 1.2rem; }
    form input, form select, form textarea { width: 100%; margin-bottom: 15px; padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.95rem; }
    .wa-button { background: #25D366; color: white; text-decoration: none; padding: 15px 25px; border-radius: 8px; display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 1.1rem; transition: 0.3s; box-shadow: 0 4px 12px rgba(37,211,102,0.2); margin: 20px 0; border: none; cursor: pointer; }
    .wa-button:hover { background: #128c7e; transform: translateY(-2px); }
    .advantage-box { background: var(--primary-dark); color: white; border-bottom: 6px solid var(--brand-green); }
    .advantage-tag { background: var(--brand-green); color: white; padding: 4px 12px; font-size: 0.7rem; font-weight: bold; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
    .site-footer { background: var(--primary-dark); color: white; padding: 60px 0 30px; margin-top: 50px; }
    .footer-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 40px; }
    .brand-yellow-text { color: var(--brand-yellow); text-transform: uppercase; font-size: 0.9rem; margin-bottom: 20px; display: block; }
    .footer-links { list-style: none; padding: 0; margin: 0; }
    .footer-links li { margin-bottom: 10px; font-size: 0.9rem; }
    .footer-links a { color: #94a3b8; text-decoration: none; transition: 0.3s; }
    .footer-links a:hover { color: white; }
  </style>
</head>
<body>
  <header>
    <div class="container header-flex">
      <h2>Airsell Cargo</h2>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/services">Services</a></li>
        <li><a href="/about">About Us</a></li>
        <li><a href="/contact" class="active">Contact</a></li>
      </ul>
    </div>
  </header>

<div class="info-card">
  <h2>Request a Cargo Shipment Quote</h2>

  <form id="quoteForm" action="https://formsubmit.co/1233a26cfc71ac026ab36a3426f8e462" method="POST" enctype="multipart/form-data">
    
    <!-- Hidden Settings -->
    <input type="hidden" name="_next" value="https://airsellcargo.com/thanks.html">
    <input type="hidden" name="_subject" value="New Cargo Quote Request">
    <input type="hidden" name="_captcha" value="false">

    <!-- Client Information -->
    <h3 class="form-section-title">Client Information</h3>
    <label for="name" class="form-label">Full Name*</label>
    <input type="text" id="name" name="name" class="form-input" required>

    <label for="company" class="form-label">Company Name</label>
    <input type="text" id="company" name="company" class="form-input">

    <label for="address" class="form-label">Postal Address*</label>
    <input type="text" id="address" name="address" class="form-input" required>

    <label for="email" class="form-label">Email Address*</label>
    <input type="email" id="email" name="email" class="form-input" required>

    <label for="phone" class="form-label">Phone Number*</label>
    <input type="tel" id="phone" name="phone" class="form-input" required>

    <label for="contact_method" class="form-label">Preferred Contact Method</label>
    <select id="contact_method" name="contact_method" class="form-select">
      <option>Email</option><option>Phone</option><option>WhatsApp</option>
    </select>

    <!-- Shipment Details -->
    <h3 class="form-section-title">Shipment Details</h3>
    <label for="service" class="form-label">Service Type*</label>
    <select id="service" name="service" class="form-select" required>
      <option>Air Freight</option><option>Sea Freight</option><option>Customs Clearance</option>
    </select>

    <label for="cargo_type" class="form-label">Cargo Type*</label>
    <select id="cargo_type" name="cargo_type" class="form-select" required>
      <option>General</option><option>Perishable</option><option>Dangerous Goods</option><option>Oversized</option>
    </select>

    <label for="weight" class="form-label">Weight (kg)*</label>
    <input type="number" id="weight" name="weight" class="form-input" required>

    <label for="dimensions" class="form-label">Dimensions (L x W x H cm)*</label>
    <input type="text" id="dimensions" name="dimensions" class="form-input" placeholder="e.g. 120 x 80 x 60" required>

    <label for="origin" class="form-label">Origin (City/Port/Airport)*</label>
    <input type="text" id="origin" name="origin" class="form-input" required>

    <label for="destination" class="form-label">Destination (City/Port/Airport)*</label>
    <input type="text" id="destination" name="destination" class="form-input" required>

    <label for="ship_date" class="form-label">Preferred Shipping Date</label>
    <input type="date" id="ship_date" name="ship_date" class="form-input">

    <label for="incoterms" class="form-label">Incoterms</label>
    <select id="incoterms" name="incoterms" class="form-select">
      <option>EXW</option><option>FOB</option><option>CIF</option><option>DDP</option>
    </select>

    <!-- Additional Notes -->
    <h3 class="form-section-title">Additional Notes</h3>
    <label for="instructions" class="form-label">Special Instructions</label>
    <textarea id="instructions" name="instructions" class="form-textarea" rows="4"></textarea>

    <label for="file" class="form-label">Upload Supporting Document (optional)</label>
    <input type="file" id="file" name="file" class="form-file">

    <!-- Submit Button -->
    <button type="submit" class="btn-submit">Request Quote</button>
  </form>
</div>
